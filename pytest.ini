[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests for individual components (models, single filter steps)
    integration: Full pipeline integration tests (complete filtering runs)
    gradient: Gradient quality tests for differentiable particle filters
    convergence: Asymptotic convergence rate tests (may be slow)
    slow: Tests that take more than 10 seconds
